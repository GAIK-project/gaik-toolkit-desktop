name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App (checks, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  engine:
    name: Engine (offline tests, no model key)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.14.10 format --check sidecar
      - run: uvx ruff@0.14.10 check sidecar
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -r sidecar/requirements.txt pytest
      - run: .venv/bin/python -m pytest sidecar/test_offline.py -q
